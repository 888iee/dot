#################
### AUTOSTART ###
#################

# exec-once = [workspace 14 silent] flatpak run md.obsidian.Obsidian --disable-gpu --enable-features=UseOzonePlatform --ozone-platform=x11
exec-once = systemctl --user start hyprpolkitagent
exec-once = waybar
exec-once = sleep 2 && ~/.config/hypr/set_random_wallpaper.sh
exec-once = ~/.config/hypr/wallpaper_loop.sh
exec-once = swaync
exec-once = hypridle
exec-once = [workspace 1 silent] firefox
exec-once = /usr/bin/gnome-keyring-daemon --start --components=secrets
exec = xset s 0 -dpms

exec-once = $HOME/.scripts/hypr_dynamic_monitor.conf

exec-once = /opt/pulsesecure/bin/pulseUI
exec-once = 1password
exec-once = ~/.local/bin/hyprland-per-window-layout
exec-once = flatpak run io.github.Qalculate.qalculate-qt
exec-once = chromium-browser https://teams.microsoft.com/ https://outlook.cloud.microsoft.com https://outlook.cloud.microsoft.com/calendar
